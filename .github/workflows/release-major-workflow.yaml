---
name: Release Major
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: cliffano/release-action@v2.1.0
        with:
          release_type: major
          github_token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
          git_user_email: opensource@shinesolutions.com
          git_user_name: Shine Solutions
